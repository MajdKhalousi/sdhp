# ─────────────────────────────────────────────────────────────
# SDHP nginx site configuration
# Replace "clinic.example.com" with your actual domain before deploying.
# ─────────────────────────────────────────────────────────────

# ── HTTP → HTTPS redirect ─────────────────────────────────────
server {
  listen 80;
  server_name clinic.example.com;

  # ACME challenge for Let's Encrypt certificate renewal
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# ── HTTPS main server ─────────────────────────────────────────
server {
  listen 443 ssl http2;
  server_name clinic.example.com;

  # TLS certificates (managed by certbot)
  ssl_certificate     /etc/letsencrypt/live/clinic.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/clinic.example.com/privkey.pem;

  # Modern TLS configuration
  ssl_protocols             TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;
  ssl_ciphers               ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
  ssl_session_cache         shared:SSL:10m;
  ssl_session_timeout       1d;
  ssl_session_tickets       off;

  # OCSP Stapling (remove if your cert doesn't support it)
  ssl_stapling          on;
  ssl_stapling_verify   on;
  resolver              1.1.1.1 8.8.8.8 valid=300s;
  resolver_timeout      5s;

  # HSTS — tell browsers to always use HTTPS (1 year)
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

  # ── API (NestJS on port 3001) ───────────────────────────
  location /api/ {
    limit_req zone=api burst=30 nodelay;
    limit_req_status 429;

    proxy_pass         http://api:3001;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;

    # CORS for the API is handled by NestJS — don't duplicate headers here
  }

  # Auth endpoint — strict rate limit to resist brute-force
  location = /api/v1/auth/login {
    limit_req zone=auth burst=5 nodelay;
    limit_req_status 429;

    proxy_pass         http://api:3001;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
  }

  # ── Next.js static assets (long-lived cache) ───────────
  location /_next/static/ {
    proxy_pass         http://web:3000;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;

    # Next.js content-hashes filenames — safe to cache aggressively
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # ── Next.js web app ────────────────────────────────────
  location / {
    proxy_pass         http://web:3000;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        "upgrade";
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }
}

# ─────────────────────────────────────────────────────────────
# SDHP — Staging Docker Compose
# ─────────────────────────────────────────────────────────────
# Usage:
#   cp .env.staging.example .env.staging
#   # Fill in all values in .env.staging — fresh staging secrets only,
#   # never copied from production.
#   docker compose -f docker/docker-compose.staging.yml --env-file .env.staging up -d
#
# Services:
#   postgres  — database (internal only, no exposed port)
#   redis     — cache/session store (internal only)
#   minio     — object storage (internal only)
#   api       — NestJS backend (internal only, fronted by nginx)
#   web       — Next.js frontend (internal only, fronted by nginx)
#   nginx     — reverse proxy + TLS termination (ports 80/443)
#
# This is a dedicated staging stack — see Decision 011
# (docs/00-Company/Decisions/Decision-011-No-Dev-Testing-on-Production-Host.md).
# It must never run on the production host, never reuse production
# container/volume names, and never connect to production's database,
# Redis, or MinIO. "sdhp_staging" keeps this stack's identity fully
# independent of both docker-compose.prod.yml ("sdhp_prod") and
# docker-compose.yml ("sdhp_dev").
name: sdhp_staging

services:

  # ── Database ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: sdhp_staging_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test:     ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout:  5s
      retries:  5

  # ── Cache ─────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: sdhp_staging_redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command:
      - sh
      - -c
      - 'redis-server --requirepass "$$REDIS_PASSWORD" --save 60 1'
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test:     ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping']
      interval: 10s
      timeout:  5s
      retries:  5

  # ── Object Storage ────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: sdhp_staging_minio
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER:     ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    networks:
      - internal
    healthcheck:
      test:     ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 30s
      timeout:  10s
      retries:  3

  # ── API (NestJS) ──────────────────────────────────────────
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: sdhp_staging_api
    dns:
      - 1.1.1.1
      - 8.8.8.8
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      API_PORT: 3001
      FRONTEND_URL: https://${DOMAIN}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-sdhp-staging-files}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - internal
      - external
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3001/api/v1/auth/me 2>&1 | grep -q "Unauthorized\\|message" || exit 1']
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

  # ── Web (Next.js) ─────────────────────────────────────────
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: sdhp_staging_web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

  # ── Nginx ─────────────────────────────────────────────────
  # Mounts only the staging server-block file — never the whole conf.d
  # directory, since that also contains production's domain config.
  nginx:
    image: nginx:1.25-alpine
    container_name: sdhp_staging_nginx
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d/sdhp.staging.conf:/etc/nginx/conf.d/sdhp.conf:ro
      - ./certbot-staging/conf:/etc/letsencrypt:ro
      - ./certbot-staging/www:/var/www/certbot:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - api
      - web
    networks:
      - internal
      - external

  # ── MinIO bucket initialisation (one-shot) ───────────────
  # Runs after MinIO is healthy, creates the staging bucket if it does not
  # exist, then exits. The api service depends on this completing
  # successfully so the bucket is guaranteed to exist before any upload
  # request is handled.
  minio-init:
    image: minio/mc:latest
    container_name: sdhp_staging_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
        mc mb --ignore-existing local/$${MINIO_BUCKET:-sdhp-staging-files} &&
        echo '[minio-init] Bucket ready: '$${MINIO_BUCKET:-sdhp-staging-files}
      "
    environment:
      MINIO_ROOT_USER:     ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET:        ${MINIO_BUCKET:-sdhp-staging-files}
    networks:
      - internal
    restart: no

  # ── TLS Certificate (Let's Encrypt) ──────────────────────
  certbot:
    image: certbot/certbot
    container_name: sdhp_staging_certbot
    volumes:
      - ./certbot-staging/conf:/etc/letsencrypt
      - ./certbot-staging/www:/var/www/certbot
    # Run once to issue the staging certificate:
    #   docker compose -f docker/docker-compose.staging.yml run --rm certbot certonly \
    #     --webroot --webroot-path=/var/www/certbot -d staging.elajihealth.com \
    #     --email admin@elajihealth.com --agree-tos --no-eff-email
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done'"
    networks:
      - external   # must reach acme-v02.api.letsencrypt.org for issuance and renewal

# ── Networks ──────────────────────────────────────────────────
networks:
  internal:
    driver: bridge
    internal: true   # no direct internet access
  external:
    driver: bridge   # nginx is the only internet-facing service

# ── Volumes ───────────────────────────────────────────────────
# Named, compose-scoped volumes — NOT external, and never pinned to any
# of production's pinned external volume names (see the volumes section
# of docker-compose.prod.yml). Resetting staging's data must never be
# able to touch production's.
volumes:
  postgres_data:
  redis_data:
  minio_data:
  nginx_logs:

server {
  listen 80;
  server_name staging.elajihealth.com;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  server_name staging.elajihealth.com;

  ssl_certificate /etc/letsencrypt/live/staging.elajihealth.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/staging.elajihealth.com/privkey.pem;

  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

  client_max_body_size 25m;

  location = /api/v1/auth/login {
    limit_req zone=auth burst=5 nodelay;
    limit_req_status 429;

    proxy_pass http://api:3001/api/v1/auth/login;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    proxy_pass http://api:3001/api/;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /minio/ {
    proxy_pass http://minio:9000/;
    proxy_http_version 1.1;

    # Must match the host used when signing — MinIO validates SigV4 against this.
    proxy_set_header Host minio:9000;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_request_buffering off;
  }

  location /_next/static/ {
    proxy_pass http://web:3000;
    proxy_http_version 1.1;

    proxy_set_header Host $host;

    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    proxy_pass http://web:3000;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
